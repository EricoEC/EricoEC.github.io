<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片压缩器 - 前端本地压缩</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }

        body {
            background-color: #f5f7fa;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }

        /* 修复：用 label 做上传区域，Safari 完美兼容 */
        .upload-label {
            display: block;
            border: 2px dashed #4096ff;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 30px;
            transition: all 0.3s;
        }

        .upload-label:hover {
            background-color: #f0f7ff;
        }

        .upload-label p {
            color: #666;
            margin-top: 10px;
        }

        #file-input {
            display: none;
        }

        .slider-wrap {
            margin: 30px 0;
        }

        .slider-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .slider-info span {
            font-size: 16px;
            color: #333;
        }

        #quality-slider {
            width: 100%;
            height: 8px;
            -webkit-appearance: none;
            background: #e8e8e8;
            border-radius: 4px;
            outline: none;
        }

        #quality-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            background: #4096ff;
            border-radius: 50%;
            cursor: pointer;
        }

        .preview-wrap {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .preview-card {
            flex: 1;
            min-width: 300px;
        }

        .preview-card h3 {
            color: #4096ff;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .preview-box {
            width: 100%;
            min-height: 300px;
            border: 1px solid #eee;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #fafafa;
        }

        .preview-box img {
            max-width: 100%;
            max-height: 400px;
            object-fit: contain;
        }

        .size-info {
            margin-top: 10px;
            color: #666;
            font-size: 14px;
        }

        .download-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: #4096ff;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }

        .download-btn:hover {
            background: #2b7cd3;
        }

        .download-btn:disabled {
            background: #b3d4ff;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📷 前端图片压缩器 - 滑动调节清晰度</h1>

        <!-- 修复：用 label 关联 input，Safari 原生支持点击 -->
        <label class="upload-label">
            <p>点击上传图片（支持超大图、无损原图）</p>
            <input type="file" id="file-input" accept="image/*">
        </label>

        <!-- 质量滑块 -->
        <div class="slider-wrap">
            <div class="slider-info">
                <span>压缩质量：<strong id="quality-value">80</strong>%</span>
                <span>低清晰度 ←→ 高清晰度</span>
            </div>
            <input type="range" id="quality-slider" min="10" max="100" value="80" step="1">
        </div>

        <!-- 对比预览 -->
        <div class="preview-wrap">
            <div class="preview-card">
                <h3>原图</h3>
                <div class="preview-box" id="origin-preview">
                    <p>请上传图片</p>
                </div>
                <div class="size-info" id="origin-size">大小：-</div>
            </div>
            <div class="preview-card">
                <h3>压缩后</h3>
                <div class="preview-box" id="compress-preview">
                    <p>请上传图片</p>
                </div>
                <div class="size-info" id="compress-size">大小：-</div>
            </div>
        </div>

        <!-- 下载按钮 -->
        <button class="download-btn" id="download-btn" disabled>下载压缩后的图片</button>
    </div>

    <script>
        // 获取DOM元素
        const fileInput = document.getElementById('file-input');
        const qualitySlider = document.getElementById('quality-slider');
        const qualityValue = document.getElementById('quality-value');
        const originPreview = document.getElementById('origin-preview');
        const compressPreview = document.getElementById('compress-preview');
        const originSize = document.getElementById('origin-size');
        const compressSize = document.getElementById('compress-size');
        const downloadBtn = document.getElementById('download-btn');

        let originFile = null; // 保存原图文件
        let compressBlob = null; // 保存压缩后的Blob

        // 监听文件上传（原生 change 事件，Safari 兼容）
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            originFile = file;
            downloadBtn.disabled = false;

            // 显示原图预览和大小
            const originUrl = URL.createObjectURL(file);
            originPreview.innerHTML = `<img src="${originUrl}" alt="原图">`;
            originSize.textContent = `原图大小：${formatFileSize(file.size)}`;

            // 执行第一次压缩
            await compressImage(file, Number(qualitySlider.value));
        });

        // 监听滑块变化，实时压缩
        qualitySlider.addEventListener('input', async () => {
            const quality = Number(qualitySlider.value);
            qualityValue.textContent = quality;

            if (originFile) {
                await compressImage(originFile, quality);
            }
        });

        // 图片压缩核心函数
        async function compressImage(file, quality) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);

                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;

                    img.onload = () => {
                        // 创建画布进行压缩
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');

                        // 保持原图宽高，不改变尺寸（只压缩质量）
                        canvas.width = img.width;
                        canvas.height = img.height;

                        // 绘制图片
                        ctx.drawImage(img, 0, 0);

                        // 导出压缩后的图片（quality 0~1）
                        canvas.toBlob(
                            (blob) => {
                                compressBlob = blob;
                                const compressUrl = URL.createObjectURL(blob);

                                // 更新压缩预览和大小
                                compressPreview.innerHTML = `<img src="${compressUrl}" alt="压缩后">`;
                                compressSize.textContent = `压缩后大小：${formatFileSize(blob.size)}`;

                                resolve(blob);
                            },
                            'image/jpeg', // 统一输出JPG，压缩效率最高
                            quality / 100 // 转成0~1的系数
                        );
                    };
                };
            });
        }

        // 下载压缩后的图片
        downloadBtn.addEventListener('click', () => {
            if (!compressBlob) return;

            const url = URL.createObjectURL(compressBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `压缩图片_${qualitySlider.value}%.jpg`;
            a.click();
            URL.revokeObjectURL(url);
        });

        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return (bytes / Math.pow(k, i)).toFixed(2) + ' ' + sizes[i];
        }
    </script>
</body>
</html>
